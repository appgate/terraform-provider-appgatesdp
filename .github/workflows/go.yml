name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          install-only: true

      - name: Cache fetched specifications
        uses: actions/cache@v4
        with:
          path: .cache/specs
          key: sdp-specs-${{ hashFiles('internal/apiversion/versions.json') }}

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Tests with race detector
        run: make test-race

      - name: Module files are tidy
        run: make tidy-check

      - name: Generated code is reproducible
        run: make generate-check

      - name: Documentation is up to date
        run: make docs-check
